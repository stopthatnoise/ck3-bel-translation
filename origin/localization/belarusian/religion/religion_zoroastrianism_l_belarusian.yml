 mazdakism_adherent_plural:0 "Маздакиты"
 mazdakism_desc:1 "Радикальные пророки Зардушт Кхураган и Маздак вещали под влиянием эзотерических верований поздней античности и вдохновлялись идеей общей собственности и сотрудничества, которые должны помочь преодолеть пять демонов алчности, гнева, зависти, собственничества и мести."
 khurramism:0 "Хуррамитск"
 khurramism_adj:0 "Хуррамизм"
 khurramism_adherent:0 "Хуррамит"
 khurramism_adherent_plural:0 "Хуррамит"
 khurramism_desc:1 "В мире Света и Мрака необходимо свергнуть несправедливых правителей, чтобы поддержать силы добра. Хуррамиты верят, что божественное приходит к людям через пророков, таких как Маздак, Абу Муслим, и Муканна, и однажды вернется в образе Мессии, который объединит всех."
