 mazdayasna_desc:1 "Люди помогают в борьбе с #italic Ака Манахом#! хорошими мыслями и праведным образом жизни. Для этого следует соблюдать ритуальную чистоту, сохранять природу и уничтожать злых существ."
 zurvanism:1 "Бехаферидистск"
 zurvanism_adj:1 "Бехаферидизм"
 zurvanism_adherent:1 "Бехаферидит"
 zurvanism_adherent_plural:1 "Бехаферидиты"
 zurvanism_desc:1 "$zurvanism_adherent_plural$, ученики Бехаферида стремятся к союзу с исламским миром. В ответ на критику мусульманами основного направления зороастризма они проводят многочисленные реформы своей веры, в том числе запрет на винопитие, строгий запрет на близкородственные браки и поощрение благотворительности как способа употребить личное богатство на общественное благо."
 tenet_zurvanism_name:0 "Зурванизм"
 tenet_zurvanism_desc:1 "Зурваниты верят, что Ормазд и Ахриман были близнецами, детьми Зурвана, Создателя всего. Они были равны, но суть их была диаметрально противоположна. Зурванизм подчеркивает, что важно помогать Ахурамазде, искореняя зло и ложь."
 zurvanism_creator_god_name:0 "Зурван"
 zurvanism_creator_god_name_possessive:0 "Зурвана"
 gayomarthianism:0 "Гайомартианск"
 gayomarthianism_adj:0 "Гайомартианство"
 gayomarthianism_adherent:0 "Гайомартианец"
 gayomarthianism_adherent_plural:0 "Гайомартианцы"
 gayomarthianism_desc:1 "В основе гайомартианства лежит идея, что Ахурамазда своей мыслью случайно создал злых духов. Гайомартианство отрицает непогрешимость Мудрого Бога, вместо этого делая упор на ритуальных практиках, позволяющих открыть истину через общение с Ахурамаздой."
 khurmazta:0 "Хурмаздск"
 khurmazta_adj:0 "Хурмаздизм"
 khurmazta_adherent:0 "Хурмаздист"
 khurmazta_adherent_plural:0 "Хурмаздисты"
 khurmazta_desc:1 "Поклонение Хормусте, глубоко укоренившееся в религиозном разнообразии Согдианы, включает в себя большой набор богов и духов, как вселенских, так и берущих начало от предков. Также в этой религии поклоняются иконам, что немыслимо для многих других зороастрийцев. Впрочем, несмотря на всю уникальность отдельных ее элементов, во многом она остается вполне в пределах традиционной зороастрийской доктрины с ее ритуалами чистоты и неустанным поклонением вечным огням."
