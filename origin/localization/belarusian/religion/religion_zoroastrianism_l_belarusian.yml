 urartu_good_god_zoroaster: "Зрадашт"
 urartuism_desc:1 "Многие древние традиции слились в вере ареворди, секте тайных зороастрийцев: в их представлении Ормазда (под именем Арамазда) правит пантеоном богов, в том числе и самим солнцем, и все вместе эти божества направляют мир."
 urartu_good_god_vanatur:1 "Ванатур"
 urartuism_priest_male:1 "Азарапет"
 urartuism_priest_male_plural:1 "Азарапеты"
 afridunism: "Афридунистск"
 afridunism_adj: "Афридунизм"
 afridunism_adherent: "Афридунист"
 afridunism_adherent_plural: "Афридунисты"
 afridunism_desc: "Многие аспекты афридунизма, пропитанного как дейлемитскими традициями, так и персидским язычеством, старше даже древних предписаний зороастризма. Сторонники этой веры стараются жить по правилам, изложенным мифическим героем Фаридуном, который подчеркивает абсолютную власть глав семейств и яростный дух независимости."
 afridunism_good_god_mithra: "Митра"
 afridunism_good_god_hvar_khshaita: "Хвар-Кшаита"
 afridunism_war_god_name: "Веретрагна"
 afridunism_war_god_name_possessive: "Веретрагны"
 afridunism_priest_male:1 "заутар"
 afridunism_priest_male_plural:1 "заутары"
 doctrine_zoroastrian_branches_name: "Добро и зло"
 doctrine_zoroastrian_branches_desc: "Нужно ли нам поддерживать назначенных жрецов и их доктрины, чтобы защитить свою веру от ереси, — или это именно жрецы стали продажны и сбились с пути?"
 doctrine_major_branch_behdin_name: "Бехдин"
 doctrine_major_branch_behdin_desc: "Пусть наши способы поклонения расходятся в мелких деталях, но разве мы, как зороастрийцы, не согласны в основах почитания Ахурамазды?"
 doctrine_heretic_branch_zandik_name: "Коррамдин"
 doctrine_heretic_branch_zandik_desc: "Бехдины зовут нас еретиками, изгоями, подрывающими устои. Хоть нас объединяет лишь их презрение, праведность заставляет диктует нам необходимость к сопротивлению, а их высокомерие ожесточает наши сердца."
 doctrine_parameter_hostility_override_doctrine_major_branch_behdin: "Воспринимает другие бехдинские [Concept( 'faiths', 'конфессии' )|E] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_heretic_branch_zandik: "Воспринимает другие коррамдинские [Concept( 'faiths', 'конфессии' )|E] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
