 bilikuism: "Биликуистск"
 bilikuism_desc: "Почитатели богини-паучихи Билику, биликуисты придерживаются враждебных отношений со своими богами. Говорят, что сама Билику из мести насылает муссоны на своих последователей, если те уничтожают ее творения и не могут жить в гармонии с сотворенным ей миром. В пантеон входят Билику и ее муж, их дети, а также бесчисленное множество предков-людей."
