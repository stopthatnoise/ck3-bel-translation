 north_african_religion_desc:0 "Традиционные берберские верования опираются на культ мертвых. Согласно ним, умерший становится божеством собственного семейства. Поклонение камням и возведение мегалитов приближает последователей к богам. Наряду с богом-творцом главными богами являются боги Солнца и Луны. Синкретизм с североафриканскими верованиями часто встречается даже среди последователей других конфессий."
