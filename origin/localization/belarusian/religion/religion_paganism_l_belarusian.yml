 pulugaism: "Пулугуистск"
 pulugaism_desc: "Пулугуисты верят, что мир был сотворен богом-ящерицей Пулугу, но люди вызвали его недовольство и он обрушил на мир великий потоп. Выжили лишь двое мужчин и две женщины, и Пулугу помог им воссоздать мир. Люди вновь научились пользоваться огнем, а Пулугу воссоздал все живое вокруг. Последователи этой веры связывают с Пулугу сложные, подчас даже враждебные отношения. Поступки, вызывающие гнев Пулугу, приводят к природным катаклизмам, однако его можно задобрить с помощью жертвоприношения."
