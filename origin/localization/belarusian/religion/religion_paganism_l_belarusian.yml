 biliku_religion_desc: "Это вера в богов, которые находятся в сложных отношениях с человечеством. Во многих народных преданиях великие предки наккаварцев вступают в битву со своими богами. Некоторые представляют главное божество этой религии как женщину-паука, а другие — как мужчину-ящерицу. Как бы то ни было, во всех версиях этих историй рассказывается о том, как один из предков украл у творца огонь, после чего тот устал от людей и покинул материальный мир. При этом творец оставил после себя сыновей, которые обратились в ветер, чтобы приносить людям как награды, так и наказания."
