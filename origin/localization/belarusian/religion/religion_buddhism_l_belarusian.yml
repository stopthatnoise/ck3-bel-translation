 GLOSS_NEMBUTSU: "Повторение имени Амитабхи — древняя духовная практика, ставшая особенно популярной в буддийских школах Восточной Азии. Известная как «няньфо» в Китае или «нэмбуцу» в Японии, эта практика является своего рода воззванием к милосердию Амитабхи, который способен открыть путь к Чистой земле любому человеку вне зависимости от его происхождения."
