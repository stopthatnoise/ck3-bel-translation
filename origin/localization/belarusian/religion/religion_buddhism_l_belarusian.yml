 buddhism_religion_desc:0 "Буддизм следует учению Будды Гаутамы и последующих «просветленных» о духовном пробуждении и говорит о бесконечном мучительном процессе перерождений, который можно прервать, лишь достигнув Нирваны. Достижение просветления — это единственный способ покинуть Сансару и войти в небытие Нирваны."
