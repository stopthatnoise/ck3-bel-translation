 ari_desc: "Ари причудливо сочетает в себе элементы тантрического буддизма, духопочитания, традиционного поклонения нага и индуизма. Хотя представления этой конфессии весьма нестандартны, адептов ари причисляют к буддистам."
 theravada:0 "Тхеравадск"
 theravada_adj:0 "Тхеравада"
 theravada_adherent:0 "Тхеравадин"
 theravada_adherent_plural:0 "Тхеравадины"
 theravada_desc:0 "Путь к просветлению лежит через личный опыт, рефлексию и размышления. Гаутама Будда достиг Нирваны, и единственный способ последовать за ним и тоже достичь ее — пережить, узнать и изучить собственное существование."
 mahayana:0 "Махаянск"
 mahayana_adj:0 "Махаяна"
 mahayana_adherent:0 "Махаянист"
 mahayana_adherent_plural:0 "Махаянисты"
 mahayana_desc:0 "Уход из Сансары — это не личное дело каждого, но опыт, которым нужно делиться с разумными существами. Состояние будды — лишь очередной этап на долгом пути всех разумных существ к Нирване, добродетельная цель Сансары."
 vajrayana:0 "Ваджраянск"
 vajrayana_adj:0 "Ваджраяна"
 vajrayana_adherent:0 "Ваджраянист"
 vajrayana_adherent_plural:0 "Ваджраянисты"
 vajrayana_desc:0 "Мотивация на пути к состоянию будды играет важнейшую роль, и истинного просветления можно достичь, лишь стремясь к выгоде для всех разумных существ. Все рождены с просветленным разумом, но существование затуманивает его. Таким образом, практика созерцания истинности мира и вселенной позволяет достичь внутреннего просветления."
