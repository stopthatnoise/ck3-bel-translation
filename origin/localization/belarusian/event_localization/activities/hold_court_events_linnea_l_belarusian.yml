l_belarusian:
 hold_court.5010.t:0 "Бесчинства в графстве [county.GetNameNoTierNoTooltip]"
 hold_court.5010.desc_marshal:0 "[marshal.GetCouncilTitle|U] [marshal.GetTitledFirstName] подходит к трону.\n\n"
 hold_court.5010.desc:0 "К трону приближается [Select_CString(peasant.IsFemale, 'перепуганная крестьянка', 'перепуганный крестьянин' )]. [peasant.GetSheHe|U] нервно мнет в руках шапку.\n\n"
 hold_court.5010.desc.outro: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], [county.GetName] кишит разбойниками и бандитами. Выделите хоть немного средств, и тогда стража сможет восстановить порядок»."
 hold_court.5010.a:0 "Любопытная мысль, давай попробуем."
 hold_court.5010.b:0 "Правда твоя, пора пролить #EMP еще больше#! крови!"
 hold_court.5010.c:1 "У меня нет на это времени."
 hold_court.5030.t:0 "Письменный язык"
 hold_court.5030.desc:1 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] показывает мне листок, покрытый неизвестными символами, и заверяет, что его можно прочесть.\n\n«Так как письменности учатся в основном [courtier.Custom('WomenMenOpp')], я [Select_CString(courtier.IsFemale, 'придумала', 'придумал' )] алфавит, на котором могли бы писать придворные [courtier.GetWomenMen]. Если вы позволите, [courtier.Custom('LadiesLords')] приступят к учебе немедленно!»\n\nТрудно даже представить, какую свободу даст нам этот язык!"
 hold_court.5030.a:0 "Что за чудесная идея!"
 hold_court.5030.courtiers:0 "Все придворные-[courtier.Custom('FemaleMale')]:"
 hold_court.5030.b:0 "Пусть [Select_CString(court_tutor.IsFemale, 'придворная наставница', 'придворный наставник' )] [court_tutor.GetFirstNameNoTooltip] поможет тебе преподавать."
 hold_court.5030.c:0 "Такой талант можно применить и лучше!"
