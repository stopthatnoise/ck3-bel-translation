 activity_local_examination_desc: "На нас ускладзены ганаровы абавязак падтрымліваць дзяржаўны лад і праводзіць гэтыя экзамены. З іх дапамогай мы можам ацаніць, вызначыць і падкрэсліць [Concept('merit', 'заслугі')|E] найбольш прыдатных асоб. Усё дзеля будучага росквіту дзяржавы."
