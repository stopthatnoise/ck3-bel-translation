 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WITCH:0 "Ходят слухи, что [ROOT.Char.GetSheHe] смешивает запрещенные травы и насылает проклятия на своих врагов. [ROOT.Char.Custom('GetSubjectPlural')|U] вряд ли станут [ROOT.Char.GetHerHim] доверять."
 SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE:0 "Трудно сказать, какой из н[ROOT.Char.GetHerHis] получится правитель, так как у [ROOT.Char.GetHerHis] пока нет никаких достижений."
