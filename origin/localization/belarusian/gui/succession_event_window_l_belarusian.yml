 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_DEPRESSED:0 "Эта печальная душа жаждет покоя и, как кажется, не имеет достаточно стойкости, чтобы [ROOT.Char.Custom('GetSubjectPlural')] пошли за [Select_CString(ROOT.Char.IsFemale, 'ней', 'ним' )]."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_BLIND_WEAK:0 "[Select_CString(ROOT.Char.IsFemale, 'Она слепа и немощна', 'Он слеп и немощен' )], так что [ROOT.Char.Custom('GetRealmOrDomicile')|l] вынужденно переходит в руки [ROOT.Char.GetHerHis] помощников."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_EXCOMMUNICATED:0 "Несмотря на отлучение от церкви и клеймо еретика, [ROOT.Char.GetSheHe] приходит к власти. Многие уверены, что [ROOT.Char.Custom('GetRealmOrDomicile')|l] погибнет."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_BERSERKER:0 "Яростный и неумолимый воин, [ROOT.Char.GetSheHe], по мнению многих, воет на луну, а в битвах пьет кровь своих врагов."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CANNIBAL:0 "Заслужить доверие вассалов [ROOT.Char.GetHerHim] будет непросто: ходят слухи, что [ROOT.Char.GetSheHe] питается человечиной."
