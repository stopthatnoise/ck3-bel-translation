 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_BURGUNDY_DESC:0 " Благодаря вашему мудрому правлению бургундцы позабыли о своих распрях и объединились."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_ITALY_DESC:0 " Именно под вашим правлением и бдительным оком империя $e_italy$ объединилась под властью одной короны."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_AFRICA_DESC:0 " Благодаря вашим усилиям и мудрому правлению Африканский континент объединился под властью одного правителя."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_PORTUGAL_DESC:0 " Но можно ли считать, что вы умерли, если память о создании королевства $k_portugal$ останется жить в веках?"
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_CANARIAS_DESC:0 " Любой обитатель островов знает, что вы основали королевство $k_canarias$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BOSNIA_DESC:0 " Да любая лошадь в Боснии знает ваше имя после того, как вы создали королевство $k_bosnia$."
