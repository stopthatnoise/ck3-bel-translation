 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_RYUKYU_DESC: "Вас запомнят как человека, который объединил островные кланы и основал империю $e_ruucuu$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SIAM_DESC: "Основав королевство $k_siam$, вы навсегда вписали свое имя в историю человечества."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_KINGDOM_DESC: " Вы вдохновили свой народ и объединили его под небесами Аллаха, основав королевство Бруней"
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_EMPIRE_DESC: " Верующие Борнео запомнят вас как пастыря, оберегавшего их от зла, и как основателя империи Бруней"
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ISRAEL_DESC:0 " Благодаря вашим усилиям появилось королевство $k_israel$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_OUTREMER_DESC:0 " Ничего бы этого не было, если бы вы не стали главной силой в самой спорной священной области мира и не создали империю $e_outremer$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SWITZERLAND_DESC:0 " Даже с вершины Альп не получится объять взглядом все земли, вошедшие в ваше королевство $k_switzerland$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_AUSTRIA_DESC:0 " После вашего правления эрцгерцогство стало одной из наиболее уважаемых держав Европы."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ARAGON_DESC:0 " Королевство $k_aragon$, рожденное на извилистых берегах реки Арагон, станет памятником вашему славному правлению."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_ROMAN_EMPIRE_DESC:0 "Благодаря вам Вселенная будет знать, что даже после тысячелетий забвения $h_roman_empire$ восстанет из пепла."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_DUMNONIA_DESC:0 " Благодаря вам корнцы объединились и вновь создали королевство $k_cornwall$."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_CAROLINGIAN_DESC:0 " Вы воплотили мечту Карла Великого о возрождении королевства $e_france$."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_HOLY_ROMAN_EMPIRE_DESC:0 " Вы истинное воплощение славы, ведь благодаря вам $e_hre$ вновь была создана."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_OLD_VASCONIA_DESC: "По вашей воле баски вернули свои утраченные земли на Иберийском полуострове и восстановили королевство Васкония."
