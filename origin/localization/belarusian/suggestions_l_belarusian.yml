l_belarusian:
 SUGGESTION_TITLE:0 "#T $NAME$#!"
 suggestion_recruit_maa_label:0 "Наняць збройных"
 suggestion_recruit_maa:0 "Прапанова: найміце полк збройных"
 suggestion_recruit_maa_desc:0 "У вас менш [Concept( 'men_at_arms', 'збройных' )|E], чым належыць мець [Concept( 'ruler', 'валадару' )|E] вашага [Concept( 'rank', 'ранга' )|E].\n\nНаём дадатковых палкоў узмоцніць вашы [Concept( 'armies', 'армii' )|E] і дапаможа як адганяць магчымых ворагаў, так і разбіць тых, хто ўсё ж такі наважыцца ў бой."
 suggestion_recruit_maa_click:0 "#I Націсні, каб паглядзець свае войскі#!"
 suggestion_declare_war_label:0 "Абвясціць вайну"
 suggestion_declare_war:0 "Прапанова: абвясціце вайну персанажу [recipient.GetShortUINameNoTooltip]"
 suggestion_declare_war_desc:1 "Перамогшы персанажа [recipient.GetShortUIName], вы заваюеце больш тэрыторый, і ваша [realm|El] разрасцецца, што спрыяе росту і доўгаму росквіту вашага [houses|El]."
 suggestion_declare_war_click:1 "#I Націсні, каб абвясціць вайну#!"
 suggestion_construct_building_label:0 "Будоўля будынка"
 suggestion_construct_building:0 "Прапанова: пабудуйце будынак у рэгіёне [landed_title.GetNameNoTierNoTooltip]"
 suggestion_construct_building_desc:1 "Будоўля будынкаў у рэгіёне [landed_title.GetNameNoTooltip] прынясе вам карысць: як імгненную, так і ў доўгатэрміновай перспектыве."
 suggestion_construct_building_click:1 "#I Націсні, каб паглядзець уладанні#!"
 suggestion_fabricate_claim_label:0 "Сфабрыкаваць прэтэнзію"
 suggestion_fabricate_claim:0 "Прапанова: сфабрыкуйце прэтэнзію на тытул [landed_title.GetNameNoTierNoTooltip]"
 suggestion_fabricate_claim_desc:1 "Суседні рэгіён — [landed_title.GetName] — багаты і квітнеючы, але вы не можаце заваяваць яго без [Concept( 'casus_belli', 'казуса беллі' )|E].\n\nВаш [Concept( 'court_chaplain', 'прыдворны капелан' )|E] або [Concept( 'realm_priest', 'дзяржаўны святар' )|E] павінен сфабрыкаваць [Concept( 'claim', 'пратэнзію' )|E], каб у вас з'явілася законная падстава пайсці на суседзяў [Concept( 'war', 'вайной' )|E] і забраць тытул!"
 suggestion_fabricate_claim_click:1 "#I Націсні, каб паглядзець тытул#!"
 suggestion_create_title_label:0 "Стварыць тытул"
 suggestion_create_title:0 "Прапанова: стварыце тытул [landed_title.GetNameNoTooltip]"
 suggestion_create_title_desc:1 "У вас дастаткова тэрыторый [de_jure|El], каб [create|El] [landed_title.GetName]. Пры гэтым вы атрымаеце званне [Concept('rightful_liege', 'законнага сюзерэна')|El] усіх уключаных у яго тытулаў, а ваш [prestige|El] значна ўзрасце."
 suggestion_create_title_click:1 "#I Націсні, каб паглядзець тытул#!"
 SUGGESTIONS_DEBUG:0 "#D АДЛАДКА ПРАПАНОЎ:#!"
 suggestion_convert_county_label:0 "Звярнуць графства"
 suggestion_convert_county:0 "Прапанова: змяніце канфесію ў рэгіёне [landed_title.GetNameNoTierNoTooltip]"
 suggestion_convert_county_desc:0 "Калі [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E] адправіцца пераконваць жыхароў рэгіёна [landed_title.GetName] прыняць сапраўдную веру, абстаноўка там стане спакайнейшай."
 suggestion_convert_county_click:1 "#I Націсні, каб паглядзець сваю раду#!"
 suggestion_increase_control_label:0 "Павышэнне кантролю"
 suggestion_increase_control:0 "Прапанова: павялічце кантроль у рэгіёне [landed_title.GetNameNoTierNoTooltip]"
 suggestion_increase_control_desc:2 "Калі [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|E] адправіцца ўмацоўваць кантроль у рэгіёне [landed_title.GetName], гэта прынясе нямала карысці: зменшыцца [county_corruption|El], магчымыя і іншыя станоўчыя эфекты."
 suggestion_increase_control_click:1 "#I Націсні, каб паглядзець сваю раду#!"
 suggestion_increase_opinion_label:0 "Павысіць меркаванне"
 suggestion_increase_opinion:0 "Прапанова: палепшыце меркаванне персанажа [recipient.GetShortUINamePossessiveNoTooltip] пра вас"
 suggestion_increase_opinion_desc:0 "[Select_CString(recipient.IsFemale, 'Ваша', 'Ваш')] [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l] [recipient.GetShortUIName] нізкага [Concept('opinion', 'меркавання')|El] пра вас. [personal_scheme|E] дапамогуць павысіць яго і палегчаць вам жыццё."
 suggestion_increase_opinion_click:1 "#I Націсні, каб пачаць змовы ўплыву#!"
 suggestion_raid_label:0 "Налёт"
 suggestion_raid:0 "Прапанова: здзейсніце налёт на зямлю [landed_title.GetNameNoTierNoTooltip]"
 suggestion_raid_desc:0 "Ад [Concept('raid', 'налёта')|E] вашай арміі на зямлю [landed_title.GetNameNoTierNoTooltip] вы атрымаеце [Concept('loot', 'здабычу')|E]."
 suggestion_raid_click:1 "#I Націсні, каб паглядзець свае войскі#!"
 suggestion_grant_title_label:0 "Даровать титул"
 suggestion_grant_title:0 "Предложение: пусть [recipient.GetShortUINameNoTooltip] получит от вас титул [landed_title.GetNameNoTierNoTooltip]"
 suggestion_grant_title_desc:0 "[recipient.GetShortUIName] — [de_jure|El] [Select_CString(recipient.IsFemale, 'ўладальніца', 'ўладальнік')] тытула [landed_title.GetName]. Каб забяспечыць максімальную стабільнасць і пазбегнуць празмернага зніжэння меркавання, пераканайцеся, што статус дэ-юрэ строга выконваецца ў вашай дзяржаве."
 suggestion_grant_title_click:1 "#I Націсні, каб надаць тытул#!"
 suggestion_can_hire_court_positions:0 "Замясціць прыдворныя пасады"
 suggestion_can_hire_court_positions_label:0 "Прапанова: замясціць больш прыдворных пасад"
 suggestion_can_hire_court_positions_desc:0 "Вам варта патраціцца на замяшчэнне [Concept( 'court_positions', 'прыдворных пасад' )|E], каб атрымаць ад іх бонусы."
 suggestion_can_hire_court_positions_click:0 "#I Націсні, каб паглядзець даступныя прыдворныя пасады#!"
 suggestion_request_war_aid_petition:0 "Папрасіць пра ваенную дапамогу"
 suggestion_request_war_aid_petition_label:0 "Прапанова: папрасіць пра ваенную дапамогу"
 suggestion_request_war_aid_petition_desc:0 "Вы можаце папрасіць [Concept( 'liege', 'сюзерэна' )|E] дапамагчы вам у вашых [Concept( 'wars', 'войнах' )|E]. Сюзерен можа далучыцца да вас або паслаць грошай на ўтрыманне арміі."
 suggestion_request_war_aid_petition_click:0 "#I Націсні, каб адкрыць [Concept( 'royal_court', 'манаршы двор' )|E] вашага [Concept( 'liege', 'сюзерэна' )|E]#!"
 suggestion_create_nation_fracturing_faction:0 "Ствары фракцыю за падзел краіны"
 suggestion_create_nation_fracturing_faction_label:0 "Прапановa: $suggestion_create_nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_desc:1 "Кіньце выклік вашаму [Concept( 'liege', 'сюзерену' )|E] і паспрабуйце дасягнуць распаду краіны, што дазволіць вам і вашым братам-[Concept( 'vassals', 'вассалам' )|E] атрымаць незалежнасць."
 suggestion_create_nation_fracturing_faction_click:1 "#I Націсні, каб убачыць фракцыі, якія выступаюць супраць вашага [Concept( 'liege', 'сюзерэна' )|E]#!"
